name: Build PreFer audio.cpp images

on:
  push:
    branches: [main]
    paths:
      - 'docker/audio-cpp/**'
      - '.github/workflows/build-audio.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify generated audio configuration and inventory
        run: python docker/audio-cpp/generate.py --check

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cuda12
            dockerfile: docker/audio-cpp/Dockerfile
          - variant: cpu
            dockerfile: docker/audio-cpp/Dockerfile.cpu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=audio-${{ matrix.variant }}
            type=sha,prefix=audio-${{ matrix.variant }}-sha-,format=short
          labels: |
            io.prefer.runtime=audio.cpp
            io.prefer.audio.backend=${{ matrix.variant }}
            io.prefer.deployment-inventory.path=/deployment-inventory.json
            io.prefer.deployment-inventory.schema=prefer.audio-deployment-inventory.v1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/audio-cpp
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=audio-${{ matrix.variant }}
          cache-to: type=gha,scope=audio-${{ matrix.variant }},mode=max

  publish-inventory:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload audio deployment inventory
        uses: actions/upload-artifact@v4
        with:
          name: prefer-audio-deployment-inventory-${{ github.sha }}
          path: docker/audio-cpp/deployment-inventory.generated.json
          if-no-files-found: error
