name: Build PreFer image

on:
  push:
    branches: [main]
    paths:
      - 'docker/prefer/**'
      - '.github/workflows/build-prefer.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify generated presets
        run: python docker/prefer/generate-presets.py --check

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
          labels: |
            io.prefer.deployment-inventory.path=/deployment-inventory.json
            io.prefer.deployment-inventory.schema=prefer.deployment-inventory.v1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/prefer
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload deployment inventory
        uses: actions/upload-artifact@v4
        with:
          name: prefer-deployment-inventory-${{ github.sha }}
          path: docker/prefer/deployment-inventory.generated.json
          if-no-files-found: error
