name: prefer

services:
  prefer:
    container_name: prefer-llama
    build:
      context: ./docker/llama-cpp
      dockerfile: Dockerfile
    image: prefer:llama-cuda-local
    ports:
      - "${LLM_PORT:-8080}:8080"
    volumes:
      - prefer-model-cache:/models
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-}
      - HF_XET_HIGH_PERFORMANCE=${HF_XET_HIGH_PERFORMANCE:-}
      - HF_XET_FIXED_DOWNLOAD_CONCURRENCY=${HF_XET_FIXED_DOWNLOAD_CONCURRENCY:-}
      - HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS=${HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT:-}
      - LLAMA_ARG_MODELS_PRESET=${LLAMA_ARG_MODELS_PRESET:-}
      - LLAMA_ARG_MODELS_MAX=${LLAMA_ARG_MODELS_MAX:-1}
      - LLAMA_DEPLOYMENT=${LLAMA_DEPLOYMENT:-}
      - LLAMA_BUNDLE=${LLAMA_BUNDLE:-}
      - LLAMA_MODELS=${LLAMA_MODELS:-}
      - LLAMA_SERVER_OVERRIDES=${LLAMA_SERVER_OVERRIDES:-}
      - LLAMA_MODEL_OVERRIDES=${LLAMA_MODEL_OVERRIDES:-}
      - PRESTAGE_MODELS=${PRESTAGE_MODELS:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_MODEL_PREFIX=${S3_MODEL_PREFIX:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  sglang:
    profiles: [sglang]
    container_name: prefer-sglang
    build:
      context: ./docker/sglang
      dockerfile: Dockerfile
    image: prefer:sglang-cuda13-local
    ports:
      - "${SGLANG_PORT:-8083}:30000"
    volumes:
      - prefer-sglang-model-cache:/models
      - prefer-sglang-video-inputs:/inputs
      - prefer-sglang-video-output:/outputs
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-}
      - HF_XET_HIGH_PERFORMANCE=${HF_XET_HIGH_PERFORMANCE:-1}
      - HF_XET_FIXED_DOWNLOAD_CONCURRENCY=${HF_XET_FIXED_DOWNLOAD_CONCURRENCY:-}
      - HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS=${HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT:-}
      - SGLANG_SERVER_CONFIG=${SGLANG_SERVER_CONFIG:-}
      - SGLANG_PRESTAGE_MODELS=${SGLANG_PRESTAGE_MODELS:-}
      - SGLANG_DEPLOYMENT=${SGLANG_DEPLOYMENT:-}
      - SGLANG_BUNDLE=${SGLANG_BUNDLE:-}
      - SGLANG_MODELS=${SGLANG_MODELS:-}
      - SGLANG_SERVER_OVERRIDES=${SGLANG_SERVER_OVERRIDES:-}
      - SGLANG_MODEL_OVERRIDES=${SGLANG_MODEL_OVERRIDES:-}
      - SGLANG_DOWNLOAD_JOBS=${SGLANG_DOWNLOAD_JOBS:-4}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_MODEL_PREFIX=${S3_MODEL_PREFIX:-}
      - SGLANG_S3_BUCKET_NAME=${SGLANG_S3_BUCKET_NAME:-}
      - SGLANG_S3_MODEL_PREFIX=${SGLANG_S3_MODEL_PREFIX:-}
      - PRESTAGE_MODELS=${PRESTAGE_MODELS:-}
      - MODEL_DOWNLOAD_JOBS=${MODEL_DOWNLOAD_JOBS:-}
      - SGLANG_VIDEO_MAX_INPUT_BYTES=${SGLANG_VIDEO_MAX_INPUT_BYTES:-1073741824}
      - SGLANG_READY_DELAY_SECONDS=${SGLANG_READY_DELAY_SECONDS:-2}
      - SGLANG_READY_PROBE_SECONDS=${SGLANG_READY_PROBE_SECONDS:-2}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm:
    profiles: [vllm]
    container_name: prefer-vllm
    build:
      context: ./docker/vllm
      dockerfile: Dockerfile
    image: prefer:vllm-cuda13-local
    ports:
      - "${VLLM_PORT:-8084}:8000"
    volumes:
      - prefer-vllm-model-cache:/models
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-}
      - HF_XET_HIGH_PERFORMANCE=${HF_XET_HIGH_PERFORMANCE:-1}
      - HF_XET_FIXED_DOWNLOAD_CONCURRENCY=${HF_XET_FIXED_DOWNLOAD_CONCURRENCY:-}
      - HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS=${HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT:-}
      - VLLM_SERVER_CONFIG=${VLLM_SERVER_CONFIG:-}
      - VLLM_PRESTAGE_MODELS=${VLLM_PRESTAGE_MODELS:-}
      - VLLM_DEPLOYMENT=${VLLM_DEPLOYMENT:-}
      - VLLM_BUNDLE=${VLLM_BUNDLE:-}
      - VLLM_MODELS=${VLLM_MODELS:-}
      - VLLM_SERVER_OVERRIDES=${VLLM_SERVER_OVERRIDES:-}
      - VLLM_MODEL_OVERRIDES=${VLLM_MODEL_OVERRIDES:-}
      - VLLM_DOWNLOAD_JOBS=${VLLM_DOWNLOAD_JOBS:-4}
      - VLLM_S3_BUCKET_NAME=${VLLM_S3_BUCKET_NAME:-}
      - VLLM_S3_MODEL_PREFIX=${VLLM_S3_MODEL_PREFIX:-}
      - PRESTAGE_MODELS=${PRESTAGE_MODELS:-}
      - MODEL_DOWNLOAD_JOBS=${MODEL_DOWNLOAD_JOBS:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_MODEL_PREFIX=${S3_MODEL_PREFIX:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  audio:
    container_name: prefer-audio
    build:
      context: ./docker/audio-cpp
      dockerfile: Dockerfile
    image: prefer:audio-cuda12-local
    ports:
      - "${AUDIO_PORT:-8081}:8080"
    volumes:
      - prefer-audio-model-cache:/models
      - prefer-audio-voices:/voices
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-}
      - HF_XET_HIGH_PERFORMANCE=${HF_XET_HIGH_PERFORMANCE:-1}
      - HF_XET_FIXED_DOWNLOAD_CONCURRENCY=${HF_XET_FIXED_DOWNLOAD_CONCURRENCY:-}
      - HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS=${HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT:-}
      - AUDIO_SERVER_CONFIG=${AUDIO_SERVER_CONFIG:-}
      - AUDIO_PRESTAGE_MODELS=${AUDIO_PRESTAGE_MODELS:-}
      - AUDIO_DEPLOYMENT=${AUDIO_DEPLOYMENT:-}
      - AUDIO_BUNDLE=${AUDIO_BUNDLE:-}
      - AUDIO_MODELS=${AUDIO_MODELS:-}
      - AUDIO_SERVER_OVERRIDES=${AUDIO_SERVER_OVERRIDES:-}
      - AUDIO_MODEL_OVERRIDES=${AUDIO_MODEL_OVERRIDES:-}
      - AUDIO_DOWNLOAD_JOBS=${AUDIO_DOWNLOAD_JOBS:-4}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  image:
    container_name: prefer-image
    build:
      context: ./docker/stable-diffusion-cpp
      dockerfile: Dockerfile
    image: prefer:image-cuda12-local
    ports:
      - "${IMAGE_PORT:-8082}:8080"
    volumes:
      - prefer-image-model-cache:/models
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-}
      - HF_XET_HIGH_PERFORMANCE=${HF_XET_HIGH_PERFORMANCE:-1}
      - HF_XET_FIXED_DOWNLOAD_CONCURRENCY=${HF_XET_FIXED_DOWNLOAD_CONCURRENCY:-}
      - HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS=${HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT:-}
      - IMAGE_SERVER_CONFIG=${IMAGE_SERVER_CONFIG:-}
      - IMAGE_PRESTAGE_MODELS=${IMAGE_PRESTAGE_MODELS:-}
      - IMAGE_DEPLOYMENT=${IMAGE_DEPLOYMENT:-}
      - IMAGE_BUNDLE=${IMAGE_BUNDLE:-}
      - IMAGE_MODELS=${IMAGE_MODELS:-}
      - IMAGE_SERVER_OVERRIDES=${IMAGE_SERVER_OVERRIDES:-}
      - IMAGE_MODEL_OVERRIDES=${IMAGE_MODEL_OVERRIDES:-}
      - IMAGE_DOWNLOAD_JOBS=${IMAGE_DOWNLOAD_JOBS:-4}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  prefer-model-cache:
    name: ${PREFER_MODEL_VOLUME:-prefer-model-cache}
  prefer-audio-model-cache:
    name: ${PREFER_AUDIO_MODEL_VOLUME:-prefer-audio-model-cache}
  prefer-audio-voices:
    name: ${PREFER_AUDIO_VOICE_VOLUME:-prefer-audio-voices}
  prefer-image-model-cache:
    name: ${PREFER_IMAGE_MODEL_VOLUME:-prefer-image-model-cache}
  prefer-sglang-model-cache:
    name: ${PREFER_SGLANG_MODEL_VOLUME:-prefer-model-cache}
  prefer-vllm-model-cache:
    name: ${PREFER_VLLM_MODEL_VOLUME:-prefer-model-cache}
  prefer-sglang-video-inputs:
    name: ${PREFER_SGLANG_VIDEO_INPUT_VOLUME:-prefer-sglang-video-inputs}
  prefer-sglang-video-output:
    name: ${PREFER_SGLANG_VIDEO_OUTPUT_VOLUME:-prefer-sglang-video-output}
