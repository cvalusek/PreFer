name: prefer

services:
  prefer:
    container_name: prefer-llama
    build:
      context: ./docker/llama-cpp
      dockerfile: Dockerfile
    image: prefer:llama-cuda-local
    ports:
      - "${LLM_PORT:-8080}:8080"
    volumes:
      - prefer-model-cache:/models
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-}
      - HF_XET_HIGH_PERFORMANCE=${HF_XET_HIGH_PERFORMANCE:-}
      - HF_XET_FIXED_DOWNLOAD_CONCURRENCY=${HF_XET_FIXED_DOWNLOAD_CONCURRENCY:-}
      - HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS=${HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT:-}
      - LLAMA_ARG_MODELS_PRESET=${LLAMA_ARG_MODELS_PRESET:-}
      - LLAMA_ARG_MODELS_MAX=${LLAMA_ARG_MODELS_MAX:-1}
      - PRESTAGE_MODELS=${PRESTAGE_MODELS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  audio:
    container_name: prefer-audio
    build:
      context: ./docker/audio-cpp
      dockerfile: Dockerfile
    image: prefer:audio-cuda12-local
    ports:
      - "${AUDIO_PORT:-8081}:8080"
    volumes:
      - prefer-audio-model-cache:/models
      - prefer-audio-voices:/voices
    environment:
      - AUDIO_SERVER_CONFIG=${AUDIO_SERVER_CONFIG:-}
      - AUDIO_PRESTAGE_MODELS=${AUDIO_PRESTAGE_MODELS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  prefer-model-cache:
    name: ${PREFER_MODEL_VOLUME:-prefer-model-cache}
  prefer-audio-model-cache:
    name: ${PREFER_AUDIO_MODEL_VOLUME:-prefer-audio-model-cache}
  prefer-audio-voices:
    name: ${PREFER_AUDIO_VOICE_VOLUME:-prefer-audio-voices}
