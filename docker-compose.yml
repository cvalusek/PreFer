name: prefer

services:
  prefer:
    container_name: prefer-llama
    build:
      context: ./docker/llama-cpp
      dockerfile: Dockerfile
    image: prefer:llama-cuda-local
    ports:
      - "${LLM_PORT:-8080}:8080"
    volumes:
      - prefer-model-cache:/models
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-}
      - HF_XET_HIGH_PERFORMANCE=${HF_XET_HIGH_PERFORMANCE:-}
      - HF_XET_FIXED_DOWNLOAD_CONCURRENCY=${HF_XET_FIXED_DOWNLOAD_CONCURRENCY:-}
      - HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS=${HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT:-}
      - LLAMA_ARG_MODELS_PRESET=${LLAMA_ARG_MODELS_PRESET:-}
      - LLAMA_ARG_MODELS_MAX=${LLAMA_ARG_MODELS_MAX:-1}
      - PRESTAGE_MODELS=${PRESTAGE_MODELS:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_MODEL_PREFIX=${S3_MODEL_PREFIX:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  sglang:
    profiles: [sglang]
    container_name: prefer-sglang
    build:
      context: ./docker/sglang
      dockerfile: Dockerfile
    image: prefer:sglang-cuda13-local
    ports:
      - "${SGLANG_PORT:-8083}:30000"
    volumes:
      - prefer-sglang-model-cache:/models
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-}
      - HF_XET_HIGH_PERFORMANCE=${HF_XET_HIGH_PERFORMANCE:-1}
      - HF_XET_FIXED_DOWNLOAD_CONCURRENCY=${HF_XET_FIXED_DOWNLOAD_CONCURRENCY:-}
      - HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS=${HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT:-}
      - SGLANG_SERVER_CONFIG=${SGLANG_SERVER_CONFIG:-}
      - SGLANG_PRESTAGE_MODELS=${SGLANG_PRESTAGE_MODELS:-}
      - SGLANG_DOWNLOAD_JOBS=${SGLANG_DOWNLOAD_JOBS:-4}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_MODEL_PREFIX=${S3_MODEL_PREFIX:-}
      - SGLANG_S3_BUCKET_NAME=${SGLANG_S3_BUCKET_NAME:-}
      - SGLANG_S3_MODEL_PREFIX=${SGLANG_S3_MODEL_PREFIX:-}
      - PRESTAGE_MODELS=${PRESTAGE_MODELS:-}
      - MODEL_DOWNLOAD_JOBS=${MODEL_DOWNLOAD_JOBS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  audio:
    container_name: prefer-audio
    build:
      context: ./docker/audio-cpp
      dockerfile: Dockerfile
    image: prefer:audio-cuda12-local
    ports:
      - "${AUDIO_PORT:-8081}:8080"
    volumes:
      - prefer-audio-model-cache:/models
      - prefer-audio-voices:/voices
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-}
      - HF_XET_HIGH_PERFORMANCE=${HF_XET_HIGH_PERFORMANCE:-1}
      - HF_XET_FIXED_DOWNLOAD_CONCURRENCY=${HF_XET_FIXED_DOWNLOAD_CONCURRENCY:-}
      - HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS=${HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT:-}
      - AUDIO_SERVER_CONFIG=${AUDIO_SERVER_CONFIG:-}
      - AUDIO_PRESTAGE_MODELS=${AUDIO_PRESTAGE_MODELS:-}
      - AUDIO_DOWNLOAD_JOBS=${AUDIO_DOWNLOAD_JOBS:-4}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  image:
    container_name: prefer-image
    build:
      context: ./docker/stable-diffusion-cpp
      dockerfile: Dockerfile
    image: prefer:image-cuda12-local
    ports:
      - "${IMAGE_PORT:-8082}:8080"
    volumes:
      - prefer-image-model-cache:/models
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-}
      - HF_XET_HIGH_PERFORMANCE=${HF_XET_HIGH_PERFORMANCE:-1}
      - HF_XET_FIXED_DOWNLOAD_CONCURRENCY=${HF_XET_FIXED_DOWNLOAD_CONCURRENCY:-}
      - HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS=${HF_XET_DATA_MAX_CONCURRENT_FILE_DOWNLOADS:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_PERFILE_SIZE:-}
      - HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT=${HF_XET_RECONSTRUCTION_DOWNLOAD_BUFFER_LIMIT:-}
      - IMAGE_SERVER_CONFIG=${IMAGE_SERVER_CONFIG:-}
      - IMAGE_PRESTAGE_MODELS=${IMAGE_PRESTAGE_MODELS:-}
      - IMAGE_DOWNLOAD_JOBS=${IMAGE_DOWNLOAD_JOBS:-4}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  prefer-model-cache:
    name: ${PREFER_MODEL_VOLUME:-prefer-model-cache}
  prefer-audio-model-cache:
    name: ${PREFER_AUDIO_MODEL_VOLUME:-prefer-audio-model-cache}
  prefer-audio-voices:
    name: ${PREFER_AUDIO_VOICE_VOLUME:-prefer-audio-voices}
  prefer-image-model-cache:
    name: ${PREFER_IMAGE_MODEL_VOLUME:-prefer-image-model-cache}
  prefer-sglang-model-cache:
    name: ${PREFER_SGLANG_MODEL_VOLUME:-prefer-model-cache}
