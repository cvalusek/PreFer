schema_version: prefer.model-source.v1
display_name: Gemma 4 26B-A4B
aliases:
  - gemma-4
capabilities:
  - text-generation
  - chat
  - streaming
  - reasoning
  - tool-calling
  - structured-output
  - image-understanding
  - video-understanding
profile:
  summary: Very fast 3.8B-active QAT multimodal synthesizer for writing, visual analysis, extraction, and
    medium-complexity planning; choose it when Gemma quality matters but dense 31B latency does not.
  architecture:
    kind: moe
    total_parameters_b: 25.2
    active_parameters_b: 3.8
  modalities:
    native_input:
      - text
      - image
      - video
    configured_input:
      - text
      - image
    output:
      - text
  context:
    native_tokens: 262144
  reasoning:
    control: request-selectable
  roles:
    preferred:
      - general-writing
      - visual-analysis
      - synthesis
      - extraction
    capable:
      - medium-planning
      - coding
      - tool-use
    avoid:
      - difficult-repository-coding
      - persistent-tool-loops
      - final-architecture
  strengths:
    - Preserves Gemma's prose and visual strengths with very fast low-active-parameter QAT inference.
    - Good quality-throughput compromise for general multimodal assistance.
  limitations:
    - Does not automatically replace a coding specialist or the dense 31B quality lane.
    - Configured vision still depends on the packaged projector and deployment verification.
  prompting:
    - Give explicit acceptance criteria for synthesis or planning; speculative decoding changes speed, not model
      behavior.
  evidence:
    confidence: mixed
    basis:
      - official
      - operator
    notes: Architecture and family behavior are publisher-backed; practical role and speed guidance reflects product and
      operator judgment.
