schema_version: prefer.model-source.v1
display_name: Gemma 4 E4B
capabilities:
  - text-generation
  - chat
  - streaming
  - reasoning
  - tool-calling
  - structured-output
  - image-understanding
  - video-understanding
  - audio-understanding
profile:
  summary: Fast compact QAT assistant for short-form writing, translation, summarization, and document or image
    extraction; more coherent than E2B but still not an unattended agent or large-code model.
  architecture:
    kind: dense
  modalities:
    native_input:
      - text
      - image
      - video
      - audio
    configured_input:
      - text
      - image
    output:
      - text
  context:
    native_tokens: 131072
  reasoning:
    control: request-selectable
  roles:
    preferred:
      - summarization
      - translation
      - short-writing
      - document-extraction
      - image-understanding
    capable:
      - code-explanation
      - general-assistance
    avoid:
      - autonomous-agents
      - repository-coding
      - deep-planning
  strengths:
    - Very fast QAT route with a useful balance of readable prose and multimodal extraction.
    - Good intermediate choice when E2B is too shallow and 12B is unnecessary.
  limitations:
    - Not dependable for long tool chains, deep planning, or final technical judgment.
    - Native audio and video are not exposed by the current llama.cpp package.
  prompting:
    - Use direct natural-language instructions and specify the desired concision and deliverable.
  evidence:
    confidence: mixed
    basis:
      - official
      - operator
      - inference
    notes: Hard capabilities are official; relative writing and role guidance combine operator experience with family-level
      inference.
default:
  repository: unsloth/gemma-4-E4B-it-qat-GGUF
  quant: ud-q4-k-xl
engines:
  llama.cpp:
    settings:
      launcher:
        spec-type: draft-mtp
        spec-draft-n-max: 4
        flash-attn: off
        top-k: 64
  sglang: {}
  vllm: {}
repositories:
  unsloth/gemma-4-E4B-it-qat-GGUF:
    discover: gguf
    quants:
      ud-q4-k-xl:
        artifacts:
          - files:
              - gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
            role: model
          - files:
              - mtp-gemma-4-E4B-it.gguf
            role: draft
          - files:
              - mmproj-F16.gguf
            role: projector
