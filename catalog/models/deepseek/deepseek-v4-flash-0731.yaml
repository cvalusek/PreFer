      - complex-planning
      - research
      - coding-design
      - long-synthesis
      - tool-orchestration
    capable:
      - autonomous-exploration
      - difficult-reasoning
      - architecture-review
    avoid:
      - casual-chat
      - low-latency-work
      - protocol-incompatible-clients
  strengths:
    - Strong release-specific agent and coding evidence with very long native context.
    - DSpark can materially improve decode speed on the configured two-GPU quality route.
  limitations:
    - Large artifacts and a specialized encoding or tool protocol make it a poor generic drop-in.
    - It is expensive for routine work and should supervise rather than absorb every implementation task.
  prompting:
    - Use the versioned response and tool format, preserve reasoning content across tool turns, and state the desired
      reasoning mode and completion boundary.
  evidence:
    confidence: mixed
    basis:
      - official
      - operator
    notes: Protocol and model capabilities are official; quality and DSpark gains remain workload- and runtime-dependent.
