schema_version: prefer.model-source.v1
display_name: MiniMax Music 3
capabilities:
  - audio-generation
  - text-to-music
  - lyrics-to-music
profile:
  summary: Heavier long-form song generator for detailed text and lyric prompts when coherence and finished-song structure
    matter more than fast iteration.
  architecture:
    kind: multi-component-music-generation-model
  modalities:
    native_input:
      - text
    configured_input:
      - text
    output:
      - audio
  reasoning:
    control: not-applicable
  roles:
    preferred:
      - long-form-songs
      - lyrics-to-music
      - arranged-music
    capable:
      - instrumentals
      - music-concepts
    avoid:
      - low-latency-preview
      - speech-synthesis
  strengths:
    - The multi-component route targets longer, more structured music and explicit lyric conditioning.
  limitations:
    - It is the largest Audio package and is slower to stage and initialize than ACE-Step.
  prompting:
    - Specify song structure, genre, instrumentation, vocal character, and lyrics; use ACE-Step when iteration speed is
      the priority.
  evidence:
    confidence: mixed
    basis:
      - official
      - configured-artifact
    notes: Capabilities and package structure are direct; relative workflow guidance is qualitative.
default:
  repository: audio-cpp/MiniMax-Music3-GGUF
  quant: q4-0
settings:
  model:
    task: gen
engines:
  audio.cpp: {}
repositories:
  audio-cpp/MiniMax-Music3-GGUF:
    discover: gguf
    quants:
      q4-0:
        artifacts:
          - files:
              - config.json
              - config/language_model.json
              - config/rvq_depth_decoder.json
              - config/condition_encoder.json
              - config/transformer.json
              - config/vocoder.json
              - tokenizer/tokenizer.json
              - tokenizer/tokenizer_config.json
              - language_model_q4_0.gguf
              - rvq_depth_decoder_q8_0.gguf
              - condition_encoder.gguf
              - transformer_q4_0.gguf
              - vocoder.gguf
        settings:
          launcher:
            session_options:
              language_model_gguf: language_model_q4_0.gguf
              rvq_depth_decoder_gguf: rvq_depth_decoder_q8_0.gguf
              flow_transformer_gguf: transformer_q4_0.gguf
              mem_saver: true
