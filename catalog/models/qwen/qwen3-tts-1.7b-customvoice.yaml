schema_version: prefer.model-source.v1
display_name: Qwen3 TTS 1.7B CustomVoice
capabilities:
  - text-to-speech
  - packaged-voices
  - style-control
profile:
  summary: Packaged-speaker TTS with explicit style control for repeatable voices that do not require a reference clip on
    every request.
  architecture:
    kind: speech-synthesis-model
    total_parameters_b: 1.7
    active_parameters_b: 1.7
  modalities:
    native_input:
      - text
    configured_input:
      - text
    output:
      - audio
  reasoning:
    control: not-applicable
  roles:
    preferred:
      - packaged-voices
      - style-controlled-tts
      - repeatable-narration
    capable:
      - character-voice-output
    avoid:
      - arbitrary-reference-cloning
      - live-full-duplex-conversation
  strengths:
    - Provides stable named speakers and style instructions without building a reference-voice asset first.
  limitations:
    - Speaker identity is limited to the packaged voice set rather than an arbitrary user voice.
  prompting:
    - Choose the speaker first, then describe delivery such as pace, emotion, intensity, and texture.
  evidence:
    confidence: high
    basis:
      - official
      - configured-artifact
default:
  repository: audio-cpp/audio.cpp-gguf
  quant: bf16
settings:
  model:
    task: tts
engines:
  audio.cpp: {}
repositories:
  audio-cpp/audio.cpp-gguf:
    quants:
      bf16:
        artifacts:
          - files:
              - Qwen3-TTS-12Hz-1.7B-CustomVoice-GGUF/qwen3-tts-12hz-1.7b-customvoice-bf16.gguf
            role: model
