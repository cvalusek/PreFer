      - repository-fixes
      - routine-reasoning
      - research-helper
    avoid:
      - sole-planner
      - final-architecture
      - long-horizon-orchestration
  strengths:
    - Low active parameter count makes it a high-throughput coding and tool worker.
    - Publisher guidance and practical use favor concrete repository tasks and explicit tests.
  limitations:
    - Can look capable early in a nested workflow and still lose the larger orchestration thread.
    - The current PreFer artifact omits its native visual projector and is configured text-only.
  prompting:
    - Use the exact Qwen tool format, define acceptance tests, and keep the objective concrete and bounded.
  evidence:
    confidence: mixed
    basis:
      - official
      - operator
      - maintainer
    notes: Coding and tool surfaces are official; the worker-versus-orchestrator distinction is reinforced by operator and
      agent-harness experience.
