name: ${PREFER_BENCH_PROJECT:?PREFER_BENCH_PROJECT must be a unique prefer-bench-* name}

services:
  router:
    build:
      context: ../docker/llama-cpp
      dockerfile: Dockerfile
      args:
        LLAMA_CPP_BASE_IMAGE: ${PREFER_BENCH_BASE_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b11058@sha256:480f67114291c698d2b13097e0e3efdd57e81aa3a9de6720564c307663868a59}
    image: ${PREFER_BENCH_IMAGE:-prefer-bench:b11058}
    ports:
      - "127.0.0.1:${PREFER_BENCH_PORT:?PREFER_BENCH_PORT must be a free non-8080 port}:8080"
    volumes:
      - models:/models:ro
    environment:
      PRESTAGE_MODELS: none
      HF_HUB_OFFLINE: "1"
      LLAMA_ARG_OFFLINE: "1"
      LLAMA_MODELS: ${PREFER_BENCH_MODELS:?PREFER_BENCH_MODELS must list explicit catalog model keys}
      LLAMA_SERVER_OVERRIDES: ${PREFER_BENCH_SERVER_OVERRIDES:-{}}
      LLAMA_MODEL_OVERRIDES: ${PREFER_BENCH_MODEL_OVERRIDES:-{}}
      LLAMA_ARG_MODELS_MAX: ${PREFER_BENCH_MODELS_MAX:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  models:
    name: ${PREFER_BENCH_VOLUME:?PREFER_BENCH_VOLUME must be a unique prefer-bench-* volume}
    external: true
